<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aarogyanetra_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AarogyaNetra</title>
    <!-- Tailwind CSS loaded locally via PostCSS -->
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <style data-purpose="background-mesh">
      .bg-clinical-mesh {
        background-color: #ebf5ff;
        background-image: 
          radial-gradient(at 10% 15%, rgba(193, 226, 255, 0.8) 0px, transparent 55%),
          radial-gradient(at 90% 20%, rgba(204, 231, 255, 0.7) 0px, transparent 60%),
          radial-gradient(at 85% 75%, rgba(180, 222, 255, 0.8) 0px, transparent 55%),
          radial-gradient(at 20% 85%, rgba(213, 237, 255, 0.7) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(240, 248, 255, 0.6) 0px, transparent 65%);
      }
      .subtle-grid {
        background-size: 55px 55px;
        background-image: 
          linear-gradient(to right, rgba(160, 198, 235, 0.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(160, 198, 235, 0.12) 1px, transparent 1px);
      }
    </style>
    <style data-purpose="retinal-animation">
      @keyframes pulse-slow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.03); opacity: 1; }
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes radar-scan {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .retina-pulse { animation: pulse-slow 8s ease-in-out infinite; }
      .retina-spin { animation: spin-slow 70s linear infinite; }
    </style>
    <style data-purpose="dock-styles">
      .react-bits-dock {
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px -4px rgba(30, 110, 190, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        border-radius: 9999px;
        padding: 5px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        position: relative;
      }
      .dock-item {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        will-change: transform, width, height;
        transform-origin: center bottom;
        transition: transform 0.18s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.18s ease;
      }
      .dock-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.85);
        color: #1e293b;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(70, 115, 170, 0.06);
        transition: background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .dock-btn-icon-only {
        padding: 7px;
        width: 36px;
        height: 36px;
        justify-content: center;
      }
      .dock-btn:hover {
        background: rgba(255, 255, 255, 0.98);
        border-color: rgba(14, 165, 233, 0.4);
        color: #0369a1;
        box-shadow: 0 6px 16px -2px rgba(14, 165, 233, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      }
      .dock-tooltip {
        position: absolute;
        top: -34px;
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        background: rgba(15, 23, 42, 0.88);
        color: #ffffff;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        pointer-events: none;
        opacity: 0;
        white-space: nowrap;
        transition: opacity 0.15s ease, transform 0.15s ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 50;
      }
      .dock-tooltip::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 4px 4px 0 4px;
        border-style: solid;
        border-color: rgba(15, 23, 42, 0.88) transparent transparent transparent;
      }
      .dock-item:hover .dock-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body class="font-sans text-slate-800 antialiased min-h-screen relative overflow-x-hidden bg-slate-50 selection:bg-sky-200 selection:text-sky-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
